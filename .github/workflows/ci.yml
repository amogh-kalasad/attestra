name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: attestra
          POSTGRES_PASSWORD: attestra
          POSTGRES_DB: attestra
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U attestra"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ATTESTRA_TEST_POSTGRES_URL: postgresql+psycopg://attestra:attestra@localhost:5432/attestra
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev,postgres]"
      - name: Ruff
        run: ruff check .
      - name: Migrations on Postgres
        run: python -c "from attestra import db; db.upgrade('postgresql+psycopg://attestra:attestra@localhost:5432/attestra')"
      - name: Pytest
        run: pytest -q
