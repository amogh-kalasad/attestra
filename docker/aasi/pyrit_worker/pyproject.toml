[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "attestra-pyrit-worker"
version = "0.1.0"
description = "Thin Attestra CLI wrapper around Microsoft PyRIT for isolated AASI scans"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "httpx>=0.27.0",
]

[project.optional-dependencies]
pyrit = ["pyrit>=0.9.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["attestra_pyrit_worker*"]
