# Promtail stub: ships Attestra JSON logs (ATTESTRA_LOG_JSON=1) to Loki. VERIFY paths/URL.
server: { http_listen_port: 9080 }
positions: { filename: /tmp/positions.yaml }
clients:
  - url: http://loki:3100/loki/api/v1/push
scrape_configs:
  - job_name: attestra
    static_configs:
      - targets: [localhost]
        labels: { job: attestra, __path__: /var/log/attestra/*.log }
    pipeline_stages:
      - json:
          expressions: { level: level, logger: logger, trace_id: trace_id }
      - labels: { level: "", logger: "" }
