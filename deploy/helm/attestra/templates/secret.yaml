{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "attestra.secretName" . }}
  labels: {{- include "attestra.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if eq .Values.secretsStore.backend "vault" }}
  ATTESTRA_API_KEY_PEPPER: {{ .Values.secrets.apiKeyPepper | default "" | quote }}
  ATTESTRA_SESSION_SECRET: {{ .Values.secrets.sessionSecret | default "" | quote }}
  {{- else }}
  ATTESTRA_API_KEY_PEPPER: {{ required "secrets.apiKeyPepper is required (or set existingSecret)" .Values.secrets.apiKeyPepper | quote }}
  ATTESTRA_SESSION_SECRET: {{ required "secrets.sessionSecret is required (or set existingSecret)" .Values.secrets.sessionSecret | quote }}
  {{- end }}
  {{- if .Values.databaseUrl }}
  ATTESTRA_DATABASE_URL: {{ .Values.databaseUrl | quote }}
  {{- end }}
{{- end }}
