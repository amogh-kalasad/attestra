apiVersion: v1
kind: Service
metadata:
  name: {{ include "attestra.fullname" . }}
  labels: {{- include "attestra.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector: {{- include "attestra.selector" . | nindent 4 }}
    app.kubernetes.io/component: api
  ports:
    - { name: http, port: {{ .Values.service.port }}, targetPort: http }
