[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "attestra"
version = "1.0.0"
description = "Attestra: security testing evidence, OWASP-aligned findings and compliance reporting (PCI DSS, ISO 27001, SOC 2)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.162.3",
  "uvicorn>=0.54.0",
  "sqlalchemy>=2.1.8",
  "pydantic>=2.14.3",
  "jinja2>=3.1.6",
  "pyyaml>=6.0.3",
  "python-multipart>=0.0.33",
  "cryptography>=50.0.2",
  "dnspython>=2.9.2",
  "defusedxml>=0.7.1",
  # Pure-Python PDF engine so report PDFs work on a fresh install (Windows included).
  "xhtml2pdf>=0.2.28",
  "python-docx>=1.2.0",
  "openpyxl>=3.1.5",
  # MongoDB persistence; SQLAlchemy remains as the MongoSession schema/query builder only.
  "pymongo>=4.19.0",
  "pytest>=9.2.0", 
  "httpx>=0.28.1", 
  "httpx2>=2.16.0", 
  "ruff>=0.17.4",
  "authlib>=1.9.5",
  "docxtpl>=0.20.2", 
  "weasyprint>=70.0",
  "boto3>=1.43.127",
  "Pillow>=13.0.0",
  "temporalio>=1.35.0"
]

[project.optional-dependencies]
dev = ["pytest>=9.2.0", "httpx>=0.28.1", "httpx2>=2.16.0", "ruff>=0.17.4"]
oidc = ["authlib>=1.9.5"]
docs = ["docxtpl>=0.20.2", "weasyprint>=70.0"]
s3 = ["boto3>=1.43.127"]
screenshots = ["Pillow>=13.0.0"]
temporal = ["temporalio>=1.35.0"]
observability = [
  "opentelemetry-api>=1.45.2",
  "opentelemetry-sdk>=1.45.2",
  "opentelemetry-instrumentation-fastapi>=0.66b2",
  "opentelemetry-exporter-otlp-proto-http>=1.45.2",
]

[project.scripts]
attestra = "attestra.cli:main"

[tool.setuptools.packages.find]
include = ["attestra*"]

[tool.setuptools.package-data]
attestra = ["compliance/data/*.yaml", "compliance/data/packs/*.yaml", "compliance/data/*.md", "reports/data/*.yaml", "reports/templates/*.j2", "reports/templates/docx/*", "web/templates/*.html", "web/static/*.css", "web/static/*.js", "web/static/fonts/*.woff2", "reports/fonts/*.ttf", "reports/fonts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: live scanner or docker runs; skipped when tools are missing",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
# Pre-existing long lines in v0.1 sources; keep CI green without a broad reformat.
ignore = ["E501"]
