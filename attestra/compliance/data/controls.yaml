# Attestra control library: control objectives (hub) -> framework requirements.
#
# The hub-and-spoke design means a finding is mapped once (CWE -> objective) and
# reaches every framework. Requirement references follow PCI DSS v4.0.1,
# ISO/IEC 27001:2022 Annex A and AICPA TSC 2017 (revised points of focus 2022).
# VERIFY every reference and title against the licensed source texts and have a
# QSA / ISO lead auditor review this file before relying on it in an audit.
#
# kind: finding  -> status derived from open findings mapped to the objective
# kind: process  -> status derived from engagement records (scans, PT, authorization)

frameworks:
  pci_dss_4:
    name: PCI DSS v4.0.1
  iso_27001_2022:
    name: ISO/IEC 27001:2022 Annex A
  soc2:
    name: SOC 2 Trust Services Criteria (Security)

objectives:
  vuln_identification:
    name: Identify and risk-rank security vulnerabilities
    kind: finding
    evidence: ["finding_inventory", "risk_ranking"]
    controls:
      pci_dss_4: ["6.3.1"]
      iso_27001_2022: ["A.8.8"]
      soc2: ["CC7.1"]

  patching:
    name: Apply security patches within defined timeframes
    kind: finding
    evidence: ["patch_records", "cve_remediation"]
    controls:
      pci_dss_4: ["6.3.3"]
      iso_27001_2022: ["A.8.8"]
      soc2: ["CC7.1", "CC8.1"]

  secure_coding:
    name: Develop software to prevent common attacks
    kind: finding
    evidence: ["sast_results", "code_review"]
    controls:
      pci_dss_4: ["6.2.4"]
      iso_27001_2022: ["A.8.28"]
      soc2: ["CC8.1"]

  web_app_protection:
    name: Protect public-facing web applications against attacks
    kind: finding
    evidence: ["dast_results", "waf_config"]
    controls:
      pci_dss_4: ["6.4.1"]
      iso_27001_2022: ["A.8.26"]
      soc2: ["CC6.6"]

  secure_config:
    name: Maintain secure configuration baselines
    kind: finding
    evidence: ["config_baseline", "hardening_evidence"]
    controls:
      pci_dss_4: ["2.2.1"]
      iso_27001_2022: ["A.8.9"]
      soc2: ["CC7.1"]

  crypto_in_transit:
    name: Use strong cryptography for data in transit
    kind: finding
    evidence: ["tls_scan", "cipher_policy"]
    controls:
      pci_dss_4: ["4.2.1"]
      iso_27001_2022: ["A.8.24"]
      soc2: ["CC6.7"]

  authentication:
    name: Authenticate users and protect credentials
    kind: finding
    evidence: ["authn_policy", "mfa_evidence"]
    controls:
      pci_dss_4: ["8.3.1", "8.4.2"]
      iso_27001_2022: ["A.8.5"]
      soc2: ["CC6.1"]

  access_control:
    name: Restrict access by business need to know
    kind: finding
    evidence: ["rbac_matrix", "access_reviews"]
    controls:
      pci_dss_4: ["7.2.1"]
      iso_27001_2022: ["A.8.3", "A.5.15"]
      soc2: ["CC6.1", "CC6.3"]

  data_protection:
    name: Prevent leakage of sensitive data
    kind: finding
    evidence: ["dlp_controls", "data_flow"]
    controls:
      pci_dss_4: ["3.5.1"]
      iso_27001_2022: ["A.8.12"]
      soc2: ["CC6.7"]

  secrets_management:
    name: Keep credentials out of source code and configuration
    kind: finding
    evidence: ["secret_scan", "vault_usage"]
    controls:
      pci_dss_4: ["8.6.2"]
      iso_27001_2022: ["A.5.17"]
      soc2: ["CC6.1"]

  logging:
    name: Log and monitor security events
    kind: finding
    evidence: ["log_samples", "siem_alerts"]
    controls:
      pci_dss_4: ["10.2.1", "10.4.1"]
      iso_27001_2022: ["A.8.15", "A.8.16"]
      soc2: ["CC7.2", "CC7.3"]

  supply_chain:
    name: Manage third-party and open-source component risk
    kind: finding
    evidence: ["sbom", "vendor_assessment"]
    controls:
      pci_dss_4: ["6.3.2"]
      iso_27001_2022: ["A.5.21"]
      soc2: ["CC9.2", "CC6.8"]

  network_segmentation:
    name: Isolate networks and verify segmentation controls
    kind: finding
    evidence: ["network_diagram", "firewall_rules"]
    controls:
      pci_dss_4: ["1.2.1", "1.3.1"]
      iso_27001_2022: ["A.8.22"]
      soc2: ["CC6.6"]

  change_management:
    name: Control changes that affect security
    kind: finding
    evidence: ["change_tickets", "cab_records"]
    controls:
      pci_dss_4: ["6.4.2", "6.5.1"]
      iso_27001_2022: ["A.8.9", "A.8.32"]
      soc2: ["CC8.1"]

  internal_scanning:
    name: Perform regular internal vulnerability scans
    kind: process
    rule: has_imports
    evidence: ["internal_scan_imports"]
    controls:
      pci_dss_4: ["11.3.1", "11.3.1.1"]
      iso_27001_2022: ["A.8.8"]
      soc2: ["CC7.1"]

  internal_scan_high_resolved:
    name: Resolve high/critical internal scan findings or document exceptions
    kind: process
    rule: no_open_high_after_retest
    evidence: ["remediation_tickets", "risk_acceptance"]
    controls:
      pci_dss_4: ["11.3.1.2"]

  asv_scanning:
    name: External ASV vulnerability scans pass quarterly
    kind: process
    rule: asv_passing_scan
    evidence: ["asv_attestation", "passing_scan_in_quarter"]
    controls:
      pci_dss_4: ["11.3.2"]
      soc2: ["CC7.1"]

  quarterly_internal_scan:
    name: Internal vulnerability scans are performed at least quarterly
    kind: process
    rule: internal_scan_quarterly
    evidence: ["scan_schedule", "quarterly_imports"]
    controls:
      pci_dss_4: ["11.3.1"]
      soc2: ["CC7.4"]

  penetration_testing:
    name: Perform penetration testing to a defined methodology
    kind: process
    rule: has_validated_pt
    evidence: ["pt_methodology", "validated_findings"]
    controls:
      pci_dss_4: ["11.4.1", "11.4.2"]
      iso_27001_2022: ["A.8.29"]
      soc2: ["CC4.1"]

  external_pt:
    name: External penetration testing of the CDE perimeter
    kind: process
    rule: has_validated_pt
    evidence: ["external_pt_report"]
    controls:
      pci_dss_4: ["11.4.3"]

  segmentation_testing:
    name: Segmentation controls are tested
    kind: process
    rule: segmentation_tested
    evidence: ["segmentation_test_record"]
    controls:
      pci_dss_4: ["11.4.5", "11.4.6"]
      iso_27001_2022: ["A.8.22"]

  remediation_retest:
    name: Correct exploitable findings and retest
    kind: process
    rule: no_open_high_after_retest
    evidence: ["retest_results"]
    controls:
      pci_dss_4: ["11.4.4"]
      iso_27001_2022: ["Clause 10.2"]
      soc2: ["CC4.2", "CC7.4"]

  testing_authorization:
    name: Plan and authorize testing to protect systems
    kind: process
    rule: has_valid_authorization
    evidence: ["signed_authorization"]
    controls:
      iso_27001_2022: ["A.8.34"]
      soc2: ["CC6.1"]

  risk_assessment_process:
    name: Information security risk assessment is performed
    kind: process
    rule: has_risk_assessment
    evidence: ["risk_register", "risk_acceptance_records"]
    controls:
      pci_dss_4: ["12.3.1"]
      iso_27001_2022: ["Clause 6.1.2", "Clause 8.2"]
      soc2: ["CC3.2"]

control_titles:
  pci_dss_4:
    "1.2.1": Network security control configuration standards are defined and maintained
    "1.3.1": Inbound traffic to the cardholder data environment is restricted to what is needed
    "2.2.1": Configuration standards are developed, implemented and maintained
    "3.5.1": Stored PAN is rendered unreadable wherever it is kept
    "4.2.1": Strong cryptography protects PAN during transmission over open, public networks
    "6.2.4": Software engineering techniques prevent or mitigate common software attacks
    "6.3.1": Security vulnerabilities are identified and managed
    "6.3.2": An inventory of bespoke and custom software and third-party components is maintained
    "6.3.3": Components are protected from known vulnerabilities by installing patches
    "6.4.1": Public-facing web applications are protected against attacks
    "6.4.2": An automated technical solution detects and prevents web-based attacks
    "6.5.1": Changes to system components follow documented change procedures
    "7.2.1": An access control model is defined
    "8.3.1": User access is authenticated
    "8.4.2": Multi-factor authentication is used for all access into the cardholder data environment
    "8.6.2": Passwords for application and system accounts are not hard coded in scripts, files or source code
    "10.2.1": Audit logs are enabled and active
    "10.4.1": Audit logs are reviewed at least daily to spot anomalies or suspicious activity
    "11.3.1": Internal vulnerability scans are performed
    "11.3.1.1": All other applicable vulnerabilities are managed
    "11.3.1.2": Internal vulnerability scans address all high-risk and critical vulnerabilities
    "11.3.2": External vulnerability scans are performed by a PCI SSC Approved Scanning Vendor
    "11.4.1": A penetration testing methodology is defined and implemented
    "11.4.2": Internal penetration testing is performed
    "11.4.3": External penetration testing is performed
    "11.4.4": Exploitable vulnerabilities found in penetration testing are corrected and retested
    "11.4.5": Segmentation controls are verified by penetration testing
    "11.4.6": Segmentation controls are verified at least every six months and after changes
    "12.3.1": A targeted risk analysis is documented and performed
  iso_27001_2022:
    "A.5.15": Access control
    "A.5.17": Authentication information
    "A.5.21": Managing information security in the ICT supply chain
    "A.8.3": Information access restriction
    "A.8.5": Secure authentication
    "A.8.8": Management of technical vulnerabilities
    "A.8.9": Configuration management
    "A.8.12": Data leakage prevention
    "A.8.15": Logging
    "A.8.16": Monitoring activities
    "A.8.22": Segregation of networks
    "A.8.24": Use of cryptography
    "A.8.26": Application security requirements
    "A.8.28": Secure coding
    "A.8.29": Security testing in development and acceptance
    "A.8.32": Change management
    "A.8.34": Protection of information systems during audit testing
    "Clause 6.1.2": Information security risk assessment
    "Clause 8.2": Information security risk assessment (operation)
    "Clause 10.2": Nonconformity and corrective action
  soc2:
    "CC3.2": The entity identifies and analyzes risk
    "CC4.1": The entity selects, develops and performs ongoing and/or separate evaluations
    "CC4.2": The entity evaluates and communicates internal control deficiencies
    "CC6.1": Logical access security software, infrastructure and architectures
    "CC6.3": Authorizes, modifies or removes access based on roles and least privilege
    "CC6.6": Logical access security measures against threats from outside system boundaries
    "CC6.7": Restricts the transmission, movement and removal of information
    "CC6.8": Prevents or detects introduction of unauthorized or malicious software
    "CC7.1": Detection and monitoring procedures identify configuration changes and vulnerabilities
    "CC7.2": Monitors system components for anomalies
    "CC7.3": Evaluates security events to determine whether they are incidents
    "CC7.4": Responds to identified security incidents
    "CC8.1": Authorizes, designs, develops, tests and implements changes
    "CC9.2": Assesses and manages risks associated with vendors and business partners
