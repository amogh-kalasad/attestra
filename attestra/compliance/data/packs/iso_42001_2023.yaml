# ISO/IEC 42001:2023 Artificial intelligence management system (AIMS). Edition 1, 2023-12.
# Catalogue: https://www.iso.org/standard/81230.html. The standard is copyrighted: every title,
# check and verification step below is our own summary, not the standard's text.
# Control IDs (38 Annex A controls in A.2-A.10, clauses 4-10) were cross-checked against the
# official contents preview and two independent public control lists
# (see reports/ISO42001_VERIFIED_CONTROLS.md). VERIFY against a licensed copy before audit use.
#
# This is a readiness / reference pack, not a certification. Certification bodies that audit
# ISO/IEC 42001 work to ISO/IEC 42006:2025 on top of ISO/IEC 17021-1.
#
# How the roll-up works: every ref is fed by an assessor_evidence process objective, so it stays
# "not_assessed" until an assessor confirms it with evidence. Tool objectives (CWE-driven
# findings) can only push a ref down to partial / not_met; a clean scan never makes a 42001
# control "met" on its own.
framework: iso_42001_2023
name: ISO/IEC 42001:2023 AI management system
pack: ISO 42001 AIMS readiness register
controls:
  # Clauses 4-10 (management-system requirements, all evidence / assessor)
  aims_context: ["Clause 4.1", "Clause 4.2", "Clause 4.3", "Clause 4.4"]
  aims_leadership: ["Clause 5.1", "Clause 5.2", "Clause 5.3"]
  aims_planning: ["Clause 6.1.1", "Clause 6.1.2", "Clause 6.1.3", "Clause 6.1.4", "Clause 6.2", "Clause 6.3"]
  aims_support: ["Clause 7.1", "Clause 7.2", "Clause 7.3", "Clause 7.4", "Clause 7.5"]
  aims_operation: ["Clause 8.1", "Clause 8.2", "Clause 8.3", "Clause 8.4"]
  aims_performance: ["Clause 9.1", "Clause 9.2", "Clause 9.3"]
  aims_improvement: ["Clause 10.1", "Clause 10.2"]
  risk_assessment_process: ["Clause 6.1.2", "Clause 8.2"]
  remediation_retest: ["Clause 10.2"]
  # Annex A controls (38): assessor / evidence objectives, one per group
  ai_policy: ["A.2.2", "A.2.3", "A.2.4"]
  ai_internal_org: ["A.3.2", "A.3.3"]
  ai_resources: ["A.4.2", "A.4.3", "A.4.4", "A.4.5", "A.4.6"]
  ai_impact_assessment: ["A.5.2", "A.5.3", "A.5.4", "A.5.5"]
  ai_lifecycle: ["A.6.1.2", "A.6.1.3", "A.6.2.2", "A.6.2.3", "A.6.2.4", "A.6.2.5", "A.6.2.6", "A.6.2.7", "A.6.2.8"]
  ai_data_governance: ["A.7.2", "A.7.3", "A.7.4", "A.7.5", "A.7.6"]
  ai_stakeholder_info: ["A.8.2", "A.8.3", "A.8.4", "A.8.5"]
  ai_responsible_use: ["A.9.2", "A.9.3", "A.9.4"]
  ai_third_party: ["A.10.2", "A.10.3", "A.10.4"]
  # Tool-supported objectives (findings by CWE). They support, never prove, a control.
  ai_prompt_injection: ["A.6.2.4", "A.6.2.3", "A.9.4"]
  ai_data_integrity: ["A.7.4", "A.7.5", "A.6.2.6"]
  ai_excessive_agency: ["A.6.2.2", "A.9.2", "A.9.4"]
  ai_resource_limits: ["A.6.2.5", "A.6.2.6", "A.4.5"]
  web_app_protection: ["A.6.2.4"]
  data_protection: ["A.6.2.4", "A.7.2"]
  access_control: ["A.6.2.4", "A.9.2"]
  supply_chain: ["A.4.4", "A.10.3"]
  patching: ["A.4.4"]
  authentication: ["A.6.2.5"]
  crypto_in_transit: ["A.6.2.5"]
  logging: ["A.6.2.8"]
titles:
  "Clause 4.1": Understand the organisation, its context and its AI role
  "Clause 4.2": Identify interested parties and what they need
  "Clause 4.3": Set the scope of the AI management system
  "Clause 4.4": Establish, run and improve the AI management system
  "Clause 5.1": Top management shows leadership and commitment
  "Clause 5.2": Set an AI policy
  "Clause 5.3": Assign AIMS roles, responsibilities and authorities
  "Clause 6.1.1": Plan actions for AI risks and opportunities
  "Clause 6.1.2": Assess AI risks with a defined method
  "Clause 6.1.3": Treat AI risks and keep a Statement of Applicability
  "Clause 6.1.4": Assess the impacts of AI systems
  "Clause 6.2": Set AI objectives and plan how to reach them
  "Clause 6.3": Plan changes to the management system
  "Clause 7.1": Provide the resources the AIMS needs
  "Clause 7.2": Make sure people are competent
  "Clause 7.3": Make people aware of the AI policy and their part
  "Clause 7.4": Plan internal and external communication
  "Clause 7.5": Create and control documented information
  "Clause 8.1": Plan and control AI operations
  "Clause 8.2": Carry out AI risk assessments as planned
  "Clause 8.3": Carry out the AI risk treatment plan
  "Clause 8.4": Carry out AI system impact assessments as planned
  "Clause 9.1": Monitor, measure, analyse and evaluate the AIMS
  "Clause 9.2": Run internal audits of the AIMS
  "Clause 9.3": Hold management reviews of the AIMS
  "Clause 10.1": Improve the AIMS continually
  "Clause 10.2": Handle nonconformities and corrective action
  "A.2.2": Have a written, approved AI policy
  "A.2.3": Keep the AI policy consistent with other organisational policies
  "A.2.4": Review the AI policy on a schedule and after major change
  "A.3.2": Assign clear AI roles and responsibilities
  "A.3.3": Give people a way to raise concerns about AI systems
  "A.4.2": Keep an inventory of the resources each AI system depends on
  "A.4.3": Record the data resources used by AI systems
  "A.4.4": Record the models, libraries and tools used
  "A.4.5": Record the compute, storage and hosting used
  "A.4.6": Record the people and skills needed
  "A.5.2": Run a defined process for AI system impact assessments
  "A.5.3": Keep records of each impact assessment
  "A.5.4": Assess effects on individuals and groups
  "A.5.5": Assess wider effects on society
  "A.6.1.2": Set goals for responsible AI development
  "A.6.1.3": Define a process for designing and building AI responsibly
  "A.6.2.2": Write down AI system requirements
  "A.6.2.3": Document design and build decisions
  "A.6.2.4": Verify and validate the AI system
  "A.6.2.5": Release only against a deployment plan
  "A.6.2.6": Run, monitor, update and support the AI system
  "A.6.2.7": Provide fitting technical documentation to each audience
  "A.6.2.8": Log AI system events
  "A.7.2": Manage data used to build and improve AI systems
  "A.7.3": Document how data is obtained and chosen
  "A.7.4": Set and check data-quality criteria
  "A.7.5": Track data provenance and lineage
  "A.7.6": Define and record data-preparation methods
  "A.8.2": Tell users what they need to use the system properly
  "A.8.3": Let outside parties report problems
  "A.8.4": Plan how AI incidents are communicated
  "A.8.5": Decide what other information to share with interested parties
  "A.9.2": Define processes for responsible use of AI systems
  "A.9.3": Set goals for responsible use
  "A.9.4": Keep the AI system to its intended use
  "A.10.2": Split responsibilities with partners, suppliers and customers
  "A.10.3": Manage AI suppliers in line with our responsible-AI approach
  "A.10.4": Take customer needs and obligations into account

# Per-ref check type and verification steps (own words). check_type values: tool | evidence | assessor.
# A "tool" entry is always partial support: it never proves the whole control.
checks:
  "Clause 4.1": {check_type: [evidence, assessor], verify: ["Review the context analysis of internal and external issues", "Confirm the organisation has recorded its AI role (provider, producer, customer, user and so on)", "Interview the AIMS owner on how context changes are tracked"]}
  "Clause 4.2": {check_type: [evidence, assessor], verify: ["Review the list of interested parties and their relevant requirements", "Check which requirements are handled through the AIMS"]}
  "Clause 4.3": {check_type: [evidence], verify: ["Review the documented AIMS scope and boundaries", "Check that AI systems in scope match the AI system inventory (A.4.2)"]}
  "Clause 4.4": {check_type: [evidence, assessor], verify: ["Review how AIMS processes and their interactions are defined", "Assessor judges whether the system is established, maintained and improved"]}
  "Clause 5.1": {check_type: [evidence, assessor], verify: ["Review management approvals, resourcing decisions and review minutes", "Interview top management on AIMS commitment"]}
  "Clause 5.2": {check_type: [evidence], verify: ["Review the AI policy: approval, version, date and that it is communicated", "Cross-check with Annex A control A.2.2"]}
  "Clause 5.3": {check_type: [evidence, assessor], verify: ["Review the role and responsibility assignments for the AIMS", "Interview a sample of role holders"]}
  "Clause 6.1.1": {check_type: [evidence], verify: ["Review the plan for addressing AI risks and opportunities", "Check that it covers intended outcomes and preventing undesired effects"]}
  "Clause 6.1.2": {check_type: [evidence, assessor], verify: ["Review the AI risk assessment method and criteria", "Sample the risk register for consistent, repeatable results", "Check the link to impact assessments (6.1.4)"]}
  "Clause 6.1.3": {check_type: [evidence, assessor], verify: ["Review the risk treatment plan", "Review the Statement of Applicability: every Annex A control included or excluded with a reason", "Check that the treatment plan owners approved residual risk"]}
  "Clause 6.1.4": {check_type: [evidence, assessor], verify: ["Review the AI system impact assessment method", "Sample completed impact assessments (see A.5.2-A.5.5)"]}
  "Clause 6.2": {check_type: [evidence], verify: ["Review the AI objectives, their measures, owners and deadlines", "Check that progress is monitored"]}
  "Clause 6.3": {check_type: [evidence], verify: ["Review records of planned AIMS changes and how they were carried out"]}
  "Clause 7.1": {check_type: [evidence, assessor], verify: ["Review budgets, staffing and tooling assigned to the AIMS"]}
  "Clause 7.2": {check_type: [evidence, assessor], verify: ["Review the competence matrix and training records", "Interview a sample of staff in AI roles"]}
  "Clause 7.3": {check_type: [evidence, assessor], verify: ["Review awareness training and attendance", "Ask a sample of staff about the AI policy and their part in it"]}
  "Clause 7.4": {check_type: [evidence], verify: ["Review the communication plan: what, when, with whom and how"]}
  "Clause 7.5": {check_type: [evidence], verify: ["Check document control: versioning, approval, access and retention", "Sample AIMS documents for current versions"]}
  "Clause 8.1": {check_type: [evidence, assessor], verify: ["Review operational planning and control records", "Sample changes and outsourced processes for control evidence"]}
  "Clause 8.2": {check_type: [evidence, assessor], verify: ["Sample AI risk assessments carried out in the period at planned intervals and after significant change"]}
  "Clause 8.3": {check_type: [evidence, assessor], verify: ["Sample risk treatment actions and check they were done and verified"]}
  "Clause 8.4": {check_type: [evidence, assessor], verify: ["Sample impact assessments carried out in the period at planned intervals and after significant change"]}
  "Clause 9.1": {check_type: [evidence], verify: ["Review what is monitored and measured, the methods and the results"]}
  "Clause 9.2": {check_type: [evidence, assessor], verify: ["Review the internal audit programme and reports", "Draw a seeded audit sample to re-perform (same flow as ISO 27001 clause 9.2)"]}
  "Clause 9.3": {check_type: [evidence], verify: ["Review management review minutes: required inputs covered and decisions recorded"]}
  "Clause 10.1": {check_type: [evidence, assessor], verify: ["Review improvement actions and their outcomes"]}
  "Clause 10.2": {check_type: [evidence, assessor], verify: ["Review the nonconformity log, root cause and corrective action records", "Check corrective actions were verified as effective (retest for technical findings)"]}
  "A.2.2": {check_type: [evidence], verify: ["Policy document with version, owner, management approval and date", "Check it covers the organisation's AI roles and principles"]}
  "A.2.3": {check_type: [evidence, assessor], verify: ["Cross-reference matrix against security, privacy, risk, HR and procurement policies", "Look for related policies updated to reflect AI"]}
  "A.2.4": {check_type: [evidence], verify: ["Review records at the planned interval", "Check change triggers (new law, incident, new use case) prompted a review"]}
  "A.3.2": {check_type: [evidence, assessor], verify: ["RACI or role descriptions across the AI life cycle", "Interview a sample of role holders"]}
  "A.3.3": {check_type: [evidence, assessor, tool], verify: ["Documented confidential reporting channel and its handling procedure", "Sample closed reports", "Optional tool check: the channel or URL is reachable"]}
  "A.4.2": {check_type: [evidence], verify: ["AI system inventory covering every life-cycle stage"]}
  "A.4.3": {check_type: [evidence], verify: ["Data sheet per dataset: source, category, labelling, retention and known bias"]}
  "A.4.4": {check_type: [evidence, tool], verify: ["Model and library register", "Tool: SBOM or AI-BOM and dependency CVE scan (for example trivy)", "Tool: model files hashed or signed"]}
  "A.4.5": {check_type: [evidence, tool], verify: ["Hosting and capacity record", "Tool: outside view of the hosting (TLS, exposed services) supports but does not prove it"]}
  "A.4.6": {check_type: [evidence, assessor], verify: ["Competence matrix and training records (links to clause 7.2)", "Interviews"]}
  "A.5.2": {check_type: [evidence, assessor], verify: ["Method document: triggers, scope, who does it and how results feed decisions", "Check the link to clauses 6.1.4 and 8.4"]}
  "A.5.3": {check_type: [evidence, assessor], verify: ["Sample completed assessments: intended use, foreseeable misuse, mitigations and retention"]}
  "A.5.4": {check_type: [evidence, assessor], verify: ["Check sections on fairness, privacy, safety and vulnerable groups", "Assessor judges depth matches the risk"]}
  "A.5.5": {check_type: [evidence, assessor], verify: ["Check sections on environment, economy, public safety and potential misuse"]}
  "A.6.1.2": {check_type: [evidence], verify: ["Documented responsible-development objectives used as design inputs"]}
  "A.6.1.3": {check_type: [evidence, assessor], verify: ["AI development life cycle: stages, test gates, approvals, change control and human oversight"]}
  "A.6.2.2": {check_type: [evidence], verify: ["Requirements specification including security, responsible-AI requirements and limits on agency or tool permissions"]}
  "A.6.2.3": {check_type: [evidence], verify: ["Design records: model choice, data assumptions, threat model and human interaction", "Threat model covers prompt injection, prompt leakage and vector store access"]}
  "A.6.2.4": {check_type: [tool, evidence], verify: ["Test plan, test data and acceptance thresholds", "Tool: imported LLM probe results (for example garak or promptfoo) with a retest after each fix", "Active testing: needs written permission and intrusive_allowed on the asset"]}
  "A.6.2.5": {check_type: [evidence, tool], verify: ["Deployment plan, release criteria, approvals and rollback", "Tool: deployed endpoint check (TLS, authentication on the model API, headers, rate limiting)"]}
  "A.6.2.6": {check_type: [tool, evidence, assessor], verify: ["Monitoring runbook, drift and performance dashboards", "Sample incident and change tickets over the period", "Tool: rate and cost limits, abuse detection, signs of poisoning or drift"]}
  "A.6.2.7": {check_type: [evidence], verify: ["Documentation for users, partners and regulators: purpose, limits, assumptions and monitoring"]}
  "A.6.2.8": {check_type: [tool, evidence], verify: ["Logging specification: events, stages and retention", "Sample logs", "Tool: logs exist and are protected, without reading their content"]}
  "A.7.2": {check_type: [evidence, assessor], verify: ["Data-management process covering privacy, security, representativeness and integrity"]}
  "A.7.3": {check_type: [evidence], verify: ["Acquisition records: source, rights or licence, selection reasons and metadata"]}
  "A.7.4": {check_type: [evidence, tool], verify: ["Quality criteria and measured results for training and production data", "Bias checks", "Optional tool check: data validation reports"]}
  "A.7.5": {check_type: [evidence, tool], verify: ["Lineage or provenance records (creation, transformations, transfers)", "Optional tool check: hashes or signatures where used"]}
  "A.7.6": {check_type: [evidence], verify: ["Preparation rules (cleaning, labelling, augmentation) and reasons, per dataset"]}
  "A.8.2": {check_type: [evidence, tool], verify: ["User documentation or notices: capabilities, limits and that AI is in use", "Optional tool check: the AI disclosure appears in the UI"]}
  "A.8.3": {check_type: [evidence, assessor, tool], verify: ["Public reporting route and its triage procedure", "Sample reports", "Optional tool check: the route works (for example security.txt or a contact page)"]}
  "A.8.4": {check_type: [evidence, assessor], verify: ["Incident communication plan (who, what, how fast, regulator duties)", "Sample past incidents"]}
  "A.8.5": {check_type: [evidence], verify: ["Disclosure register: what goes to regulators, customers and the public, and when"]}
  "A.9.2": {check_type: [evidence, assessor, tool], verify: ["Acceptable-use and human-oversight procedure", "Interviews", "Tool: agent or tool permissions and approval steps are in place"]}
  "A.9.3": {check_type: [evidence], verify: ["Responsible-use objectives with measures (for example human-in-the-loop rate)"]}
  "A.9.4": {check_type: [evidence, assessor, tool], verify: ["Intended-use statement and re-assessment before new uses", "Sample use cases", "Tool: out-of-scope prompt tests (active: written permission and intrusive_allowed needed)"]}
  "A.10.2": {check_type: [evidence], verify: ["Shared-responsibility matrix and contract clauses"]}
  "A.10.3": {check_type: [evidence, assessor, tool], verify: ["Supplier due diligence, contracts and periodic reviews", "Tool: SBOM and model-source checks for third-party models and libraries"]}
  "A.10.4": {check_type: [evidence], verify: ["Customer requirements and contract obligations reflected in AI decisions"]}

# OWASP Top 10 for LLM Applications 2025 -> 42001 refs and CWEs. Our engineering judgement:
# neither ISO nor OWASP publishes an official mapping. strength: full = the CWE squarely names the
# weakness and a test gives direct (still partial-control) evidence; partial = indirect link.
# CWE-1426 is deliberately not used (MITRE marks it DISCOURAGED for mapping).
llm_top10:
  LLM01:
    name: Prompt Injection
    controls: ["A.6.2.4", "A.6.2.3", "A.9.4"]
    cwe: [1427, 77]
    strength: full
    active_test: true
    rationale: CWE-1427 is the dedicated CWE for unneutralised input in LLM prompts; probe results evidence verification (A.6.2.4), the threat model (A.6.2.3) and intended-use limits (A.9.4).
  LLM02:
    name: Sensitive Information Disclosure
    controls: ["A.6.2.4", "A.7.2", "A.5.4"]
    cwe: [200, 359]
    strength: partial
    active_test: true
    rationale: Leak tests show exposure in answers but not how data is governed; data management (A.7.2) and impact on individuals (A.5.4) need records and an assessor.
  LLM03:
    name: Supply Chain
    controls: ["A.4.4", "A.10.3", "A.7.3"]
    cwe: [1104, 1395, 494]
    strength: full
    active_test: false
    rationale: SBOM and dependency scans directly evidence the model and library register (A.4.4) and supplier checks (A.10.3); data sources (A.7.3) still need acquisition records.
  LLM04:
    name: Data and Model Poisoning
    controls: ["A.7.4", "A.7.5", "A.6.2.6"]
    cwe: [345, 494]
    strength: partial
    active_test: false
    rationale: Integrity and authenticity weaknesses point at poisoning risk, but data quality and lineage (A.7.4, A.7.5) are proven by records, not scans.
  LLM05:
    name: Improper Output Handling
    controls: ["A.6.2.4"]
    cwe: [79, 94, 116]
    strength: full
    active_test: true
    rationale: Model output reaching a browser, interpreter or query is classic injection (CWE-79/94/116, as MITRE suggests instead of CWE-1426); tests evidence verification (A.6.2.4).
  LLM06:
    name: Excessive Agency
    controls: ["A.6.2.2", "A.9.2", "A.9.4"]
    cwe: [250, 269, 862]
    strength: partial
    active_test: true
    rationale: Privilege CWEs describe part of the risk; agency limits must also be in requirements (A.6.2.2) and responsible-use processes (A.9.2, A.9.4).
  LLM07:
    name: System Prompt Leakage
    controls: ["A.6.2.4", "A.6.2.3"]
    cwe: [200, 1427]
    strength: partial
    active_test: true
    rationale: Leakage is shown by probes (A.6.2.4); the design record (A.6.2.3) should keep secrets out of prompts, which only an assessor can confirm.
  LLM08:
    name: Vector and Embedding Weaknesses
    controls: ["A.6.2.3", "A.6.2.4", "A.7.2"]
    cwe: [284, 639]
    strength: partial
    active_test: true
    rationale: Access-control CWEs cover cross-tenant retrieval; embedding data governance (A.7.2) and design (A.6.2.3) need evidence.
  LLM09:
    name: Misinformation
    controls: ["A.6.2.4", "A.6.2.7", "A.8.2", "A.5.3"]
    cwe: []
    strength: partial
    active_test: false
    rationale: No good CWE exists; verified through evaluation results, user documentation of limits (A.6.2.7, A.8.2) and impact records (A.5.3) with human review.
  LLM10:
    name: Unbounded Consumption
    controls: ["A.6.2.5", "A.6.2.6", "A.4.5"]
    cwe: [400, 770]
    strength: full
    active_test: true
    rationale: CWE-400/770 squarely describe missing rate and cost limits; endpoint checks evidence deployment (A.6.2.5) and operations (A.6.2.6) controls.