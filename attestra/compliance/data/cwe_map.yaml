  1004: [secure_config]
  1021: [secure_config, web_app_protection]
  614: [secure_config]
  525: [secure_config]
  # Sensitive data exposure
  200: [data_protection]
  209: [data_protection, secure_config]
  497: [data_protection, secure_config]
  532: [data_protection, logging]
  # Logging and monitoring failures (OWASP A09)
  778: [logging]
  # Vulnerable and outdated components (OWASP A06)
  937: [supply_chain, patching]
