  # ---- AI / LLM weaknesses (OWASP Top 10 for LLM Applications 2025), used by the
  # ISO/IEC 42001 pack. CWE-1426 is not mapped: MITRE marks it DISCOURAGED.
  116:
    objectives: ['secure_coding', 'web_app_protection']
    strength: full
    rationale: 'Improper output encoding (OWASP LLM05 when model output reaches a browser, shell or query) maps to secure development controls.'
  117:
    objectives: ['logging']
    strength: full
    rationale: 'Unneutralised log output undermines log integrity and maps to logging and monitoring controls.'
  250:
    objectives: ['ai_excessive_agency', 'access_control']
    strength: partial
    rationale: 'Running with unnecessary privileges (OWASP LLM06 excessive agency) partly evidences least-privilege and responsible-use controls.'
  269:
    objectives: ['ai_excessive_agency', 'access_control']
    strength: partial
    rationale: 'Improper privilege management (OWASP LLM06 excessive agency) partly evidences least-privilege and responsible-use controls.'
  345:
    objectives: ['ai_data_integrity']
    strength: partial
    rationale: 'Insufficient verification of data authenticity (OWASP LLM04 poisoning) partly evidences data provenance and quality controls; lineage records need an assessor.'
  359:
    objectives: ['data_protection']
    strength: full
    rationale: 'Exposure of private personal information (OWASP LLM02) maps to leakage prevention controls.'
  400:
    objectives: ['ai_resource_limits']
    strength: full
    rationale: 'Uncontrolled resource consumption (OWASP LLM10 unbounded consumption) maps to rate, size and cost limit controls.'
  494:
    objectives: ['supply_chain', 'ai_data_integrity']
    strength: partial
    rationale: 'Code or model downloaded without an integrity check (OWASP LLM03/LLM04) partly evidences supply-chain and model integrity controls.'
  770:
    objectives: ['ai_resource_limits']
    strength: full
    rationale: 'Allocation without limits or throttling (OWASP LLM10 unbounded consumption) maps to rate, size and cost limit controls.'
  1395:
    objectives: ['supply_chain', 'patching']
    strength: full
    rationale: 'Dependency on a vulnerable third-party component (OWASP LLM03) maps to supply-chain and patching controls.'
  1427:
    objectives: ['ai_prompt_injection', 'secure_coding']
    strength: full
    rationale: 'Improper neutralisation of input used for LLM prompting (prompt injection, OWASP LLM01/LLM07) maps to AI verification and secure development controls.'
  # --- G-06 additions: CWEs emitted by automated test modules, probes and importers.
  113:
    objectives: ['secure_coding', 'web_app_protection']
    strength: full
    rationale: 'HTTP response splitting / header injection is an injection weakness addressed by secure development and web application protection controls.'
    source: 'G-06 2026-11-17'
  119:
    objectives: ['secure_coding', 'patching']
    strength: partial
    rationale: 'Memory-safety weaknesses reported by component and binary scanners are fixed by secure coding or patching; partial because exploitability depends on the component.'
    source: 'G-06 2026-11-17'
  298:
    objectives: ['crypto_in_transit']
    strength: full
    rationale: 'Improper certificate expiry validation weakens TLS protection of data in transit.'
    source: 'G-06 2026-11-17'
  299:
    objectives: ['crypto_in_transit']
    strength: full
    rationale: 'Improper certificate revocation checking weakens TLS protection of data in transit.'
    source: 'G-06 2026-11-17'
  347:
    objectives: ['authentication', 'secure_coding']
    strength: full
    rationale: 'Improper verification of cryptographic signatures (e.g. JWT alg=none or unverified tokens) breaks authentication integrity.'
    source: 'G-06 2026-11-17'
  434:
    objectives: ['secure_coding', 'web_app_protection']
    strength: full
    rationale: 'Unrestricted file upload maps to input validation and web application protection controls.'
    source: 'G-06 2026-11-17'
  506:
    objectives: ['supply_chain', 'secure_coding']
    strength: partial
    rationale: 'Embedded malicious code found in source or dependencies partly evidences supply-chain and secure development controls.'
    source: 'G-06 2026-11-17'
  524:
    objectives: ['data_protection', 'secure_config']
    strength: full
    rationale: 'Sensitive information in caches (cacheable authenticated responses) maps to data protection and secure configuration.'
    source: 'G-06 2026-11-17'
  538:
    objectives: ['data_protection', 'secure_config']
    strength: full
    rationale: 'Sensitive information in externally accessible files or directories maps to data protection and secure configuration.'
    source: 'G-06 2026-11-17'
  613:
    objectives: ['authentication']
    strength: full
    rationale: 'Insufficient session expiration maps to authentication and session management controls.'
    source: 'G-06 2026-11-17'
  644:
    objectives: ['secure_coding', 'web_app_protection']
    strength: partial
    rationale: 'Improper neutralisation of HTTP headers (Host header poisoning) maps partly to secure coding and web protection controls.'
    source: 'G-06 2026-11-17'
  915:
    objectives: ['access_control', 'secure_coding']
    strength: full
    rationale: 'Mass assignment of object attributes bypasses access restrictions and is fixed in application code.'
    source: 'G-06 2026-11-17'
  942:
    objectives: ['secure_config', 'web_app_protection']
    strength: full
    rationale: 'Permissive cross-domain (CORS) policy with untrusted origins maps to secure configuration and web application protection.'
    source: 'G-06 2026-11-17'
  346:
    objectives: ['secure_config', 'web_app_protection']
    strength: full
    rationale: 'Origin validation error (reflected or null CORS origin, missing Origin checks) maps to secure configuration and web application protection.'
    source: 'G-06 2026-11-17'
  1059:
    objectives: ['secure_config']
    strength: partial
    rationale: 'Insufficient technical documentation (undocumented or unversioned API surface) weakens configuration and inventory control; partial because documentation alone is not a vulnerability.'
    source: 'G-06 2026-11-17'
  1336:
    objectives: ['secure_coding', 'web_app_protection']
    strength: full
    rationale: 'Server-side template injection is an injection weakness addressed by secure development and web protection controls.'
    source: 'G-06 2026-11-17'
  1392:
