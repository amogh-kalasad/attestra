# CWE -> control objectives (keys in controls.yaml).
# Every finding also maps to vuln_identification; findings with a CVE also map
# to patching. Unknown CWEs fall back to `default`.
default: [vuln_identification]

cwe:
  # Injection and input handling (OWASP A03)
  20: [secure_coding, web_app_protection]
  74: [secure_coding, web_app_protection]
  77: [secure_coding, web_app_protection]
  78: [secure_coding, web_app_protection]
  79: [secure_coding, web_app_protection]
  89: [secure_coding, web_app_protection]
  94: [secure_coding, web_app_protection]
  611: [secure_coding, web_app_protection]
  917: [secure_coding, web_app_protection]
  # Broken access control (OWASP A01)
  22: [access_control, secure_coding]
  284: [access_control]
  285: [access_control]
  352: [secure_coding, web_app_protection]
  601: [secure_coding, web_app_protection]
  639: [access_control]
  862: [access_control]
  863: [access_control]
  918: [secure_coding, web_app_protection]
  # Cryptographic failures (OWASP A02)
  295: [crypto_in_transit]
  311: [crypto_in_transit, data_protection]
  319: [crypto_in_transit]
  326: [crypto_in_transit]
  327: [crypto_in_transit]
