# CWE -> control objectives (keys in controls.yaml).
# Every finding also maps to vuln_identification; findings with a CVE also map
# to patching. Unknown CWEs fall back to `default`.
# Each entry includes strength (full|partial) and rationale for library integrity.

# G-06 mapping provenance: read by compliance/engine.py (mapping_metadata) and shown in
# exports. Bump `version` and `effective` whenever a mapping changes; `reviewer` stays
# pending until a QSA / ISO lead auditor signs off (see REVIEW.md).
metadata:
  source: 'MITRE CWE 4.15 view-1000 + OWASP Top 10 2021 / ASVS 4.0.3 / WSTG 4.2; Attestra control objectives'
  version: 'cwe-map-2026.11.17'
  effective: '2026-11-17'
  reviewer: 'pending'

default: ['vuln_identification']

