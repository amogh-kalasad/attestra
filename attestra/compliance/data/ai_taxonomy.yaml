# AASI Phase 1 — AI security taxonomy mapping (Attestra).
# Source-backed probe/plugin → OWASP LLM Top 10 2025 / OWASP Agentic / CWE / ISO 42001.
# Honesty rules:
# - Do not invent CWE IDs. CWEs here are copied only from packs/iso_42001_2023.yaml llm_top10
#   (engineering judgement already documented there; neither ISO nor OWASP publishes an official map).
# - Garak's internal owasp:llmNN tags follow the 2023 LLM Top 10 numbering; map by behaviour to 2025.
# - SafeLabs ASI01–ASI10 labels are OWASP-inspired and are NOT the official OWASP Agentic Top 10.
# - Uncertain or third-party crosswalks use confidence: low or status: unverified / provisional.
# - Categories without a dedicated shipped test are marked unmapped / not_covered — never "covered".

version: "1"

sources:
  owasp_llm_top10_2025:
    name: OWASP Top 10 for LLM Applications 2025
    url: https://genai.owasp.org/llm-top-10/
    edition: "2025"
    status: published
    note: >-
      Attestra owasp.yaml llm_top10_2025 and iso_42001_2023.yaml llm_top10 use this edition.
      A 2026 LLM Top 10 also exists; this file intentionally stays on 2025 to match the pack.

  owasp_agentic:
    name: OWASP Top 10 for Agentic Applications
    project: OWASP GenAI Security Project — Agentic Security Initiative (ASI)
    edition: "2026"
    published: "2025-12-09"
    url: https://genai.owasp.org/2025/12/09/owasp-top-10-for-agentic-applications-the-benchmark-for-agentic-security-in-the-age-of-autonomous-ai/
    status: published
    entries_prefix: ASI
    note: >-
      Official entries ASI01–ASI10 (Agent Goal Hijack … Rogue Agents). Distinct from SafeLabs'
      independently structured ASI01–ASI10 prompt taxonomy.

  iso_42001_2023:
    name: ISO/IEC 42001:2023 Artificial intelligence management system
    pack: attestra/compliance/data/packs/iso_42001_2023.yaml
    llm_top10_key: llm_top10
    status: pack_present
    note: >-
      Control and CWE links are Attestra engineering judgement in the pack (not an official
      ISO↔OWASP mapping). Tool references under assessment_tools are evidence sources only;
      a clean scan never marks a 42001 control met by itself.

  coverage_matrix_reference:
    name: LLM red-team coverage matrix (independent, CC BY 4.0)
    url: https://github.com/fevziegeyurtsevenler/redteam-coverage-matrix
    snapshot: "2026-08-03"
    status: third_party_reference
    confidence: medium
    note: >-
      Used to cross-check which tools ship dedicated tests per LLM01–LLM10. Not an Attestra product.

# ---------------------------------------------------------------------------
# Official taxonomy entry lists (for reference / validation)
# ---------------------------------------------------------------------------
owasp_llm_top10_2025:
  LLM01: Prompt Injection
  LLM02: Sensitive Information Disclosure
  LLM03: Supply Chain
  LLM04: Data and Model Poisoning
  LLM05: Improper Output Handling
  LLM06: Excessive Agency
  LLM07: System Prompt Leakage
  LLM08: Vector and Embedding Weaknesses
  LLM09: Misinformation
  LLM10: Unbounded Consumption

owasp_agentic_2026:
  ASI01: Agent Goal Hijack
  ASI02: Tool Misuse and Exploitation
  ASI03: Identity and Privilege Abuse
  ASI04: Agentic Supply Chain Vulnerabilities
  ASI05: Unexpected Code Execution (RCE)
  ASI06: Memory and Context Poisoning
  ASI07: Insecure Inter-Agent Communication
  ASI08: Cascading Failures
  ASI09: Human-Agent Trust Exploitation
  ASI10: Rogue Agents

# CWE IDs allowed in this file — must match packs/iso_42001_2023.yaml llm_top10.cwe
# (empty list for LLM09 is intentional; pack has no good CWE).
cwe_from_iso_pack:
  LLM01: [1427, 77]
  LLM02: [200, 359]
  LLM03: [1104, 1395, 494]
  LLM04: [345, 494]
  LLM05: [79, 94, 116]
  LLM06: [250, 269, 862]
  LLM07: [200, 1427]
  LLM08: [284, 639]
  LLM09: []
  LLM10: [400, 770]

# ---------------------------------------------------------------------------
# Tools → probe/plugin/scenario families
# ---------------------------------------------------------------------------
tools:
  garak:
    name: NVIDIA garak (Generative AI Red-teaming & Assessment Kit)
    kind: probe_suite
    docs: https://reference.garak.ai/
    repo: https://github.com/NVIDIA/garak
    numbering_caveat: >-
      Probe tags owasp:llmNN follow the 2023 LLM Top 10 numbering. Map by behaviour to
      2025 IDs below; do not reuse the tag number as a 2025 ID.
    probes:
      promptinject:
        owasp_llm: [LLM01]
        cwe: [1427, 77]
        iso_controls: ["A.6.2.4", "A.6.2.3", "A.9.4"]
        confidence: high
        source: "garak.probes.promptinject tags include owasp:llm01; behaviour = direct injection (2025 LLM01)"
      latentinjection:
        owasp_llm: [LLM01]
        cwe: [1427, 77]
        iso_controls: ["A.6.2.4", "A.6.2.3", "A.9.4"]
        confidence: high
        source: "garak/probes/latentinjection.py — indirect/latent injection family"
      dan:
        owasp_llm: [LLM01]
        cwe: [1427]
        iso_controls: ["A.6.2.4"]
        confidence: medium
        source: "Jailbreak/DAN family; treated as prompt-injection bypass (LLM01)"
      encoding:
        owasp_llm: [LLM01]
        cwe: [1427]
        iso_controls: ["A.6.2.4"]
        confidence: medium
        source: "Obfuscated instruction delivery (base64/ROT13/hex); injection bypass"
      leakreplay:
        owasp_llm: [LLM02]
        cwe: [200, 359]
        iso_controls: ["A.6.2.4", "A.7.2", "A.5.4"]
        confidence: high
        source: "Training-data / memorisation replay; sensitive disclosure (2025 LLM02)"
      web_injection:
        owasp_llm: [LLM02, LLM05]
        cwe: [79, 200]
        iso_controls: ["A.6.2.4"]
        confidence: medium
        source: "Markdown/image XSS and exfil patterns (formerly xss.py); disclosure + improper output"
      packagehallucination:
        owasp_llm: [LLM03, LLM09]
        cwe: [1104, 494]
        iso_controls: ["A.4.4", "A.10.3"]
        confidence: medium
        source: "garak tags owasp:llm09 + owasp:llm02 (2023); behaviour ≈ package supply-chain + misinformation"
