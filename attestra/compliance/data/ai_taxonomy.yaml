# Attestra test types → taxonomy refs (authoritative for ai_llm / ai_agent)
# ---------------------------------------------------------------------------
categories:
  ai_llm:
    description: >-
      LLM application security testing (model/API chatbot surfaces without autonomous tool agency).
      Primary taxonomy: OWASP LLM Top 10 2025. ISO 42001 llm_top10 controls via pack.
    primary_taxonomy: owasp_llm_top10_2025
    secondary_taxonomy: iso_42001_2023
    tools: [garak, promptfoo, pyrit]
    covered_llm:
      - id: LLM01
        tools: [garak, promptfoo, pyrit]
        status: testable
      - id: LLM02
        tools: [garak, promptfoo]
        status: testable
        note: "PyRIT only partial via leakage datasets"
      - id: LLM03
        tools: [garak, promptfoo]
        status: partial
        note: "Package hallucination / ModelAudit proxies — not full SBOM supply-chain audit"
      - id: LLM04
        tools: [promptfoo]
        status: partial
        note: "Behavioural proxy only; training/RAG poisoning not directly tested"
      - id: LLM05
        tools: [garak, promptfoo]
        status: testable
      - id: LLM06
        tools: [promptfoo, garak]
        status: partial
        note: "promptfoo dedicated; garak agent_breaker partial; PyRIT not covered"
      - id: LLM07
        tools: [garak, promptfoo]
        status: testable
      - id: LLM08
        tools: [promptfoo]
        status: testable
        note: "garak/PyRIT have no dedicated vector/embedding probes"
      - id: LLM09
        tools: [garak, promptfoo]
        status: testable
      - id: LLM10
        tools: [garak, promptfoo]
        status: partial
    not_claiming:
      - "ISO 42001 control 'met' from tool output alone"
      - "Official ISO↔OWASP CWE mapping (pack is engineering judgement)"
      - "Full supply-chain or training-data poisoning proof from these scanners"

  ai_agent:
    description: >-
      Agentic application testing (planning, tools, memory, multi-agent). Primary taxonomy:
      OWASP Top 10 for Agentic Applications 2026 (ASI01–ASI10). SafeLabs results must be
      remapped via tools.safelabs.tests and never treated as already-official ASI IDs.
    primary_taxonomy: owasp_agentic_2026
    secondary_taxonomy: owasp_llm_top10_2025
    tools: [safelabs, promptfoo, garak, pyrit]
    covered_agentic:
      - id: ASI01
        tools: [promptfoo, safelabs, garak]
        status: partial
        confidence: low
        note: "Goal hijack ≈ hijacking / injection families; SafeLabs crosswalk unverified"
      - id: ASI02
        tools: [promptfoo, safelabs, garak]
        status: partial
        confidence: low
        note: "Tool misuse ≈ excessive-agency / agent_breaker / SafeLabs ASI03/ASI05"
      - id: ASI03
        tools: [safelabs]
        status: unverified
        confidence: low
        note: "Provisional SafeLabs ASI07 crosswalk only"
      - id: ASI04
        tools: [promptfoo]
        status: unverified
        confidence: low
        note: "MCP plugin provisional; no dedicated agentic supply-chain suite"
      - id: ASI05
        tools: [promptfoo, safelabs]
        status: partial
        confidence: low
        note: "shell/sql injection + SafeLabs insecure output — incomplete RCE coverage"
      - id: ASI06
        tools: []
        status: not_covered
        note: "No dedicated memory/context-poisoning test mapped in this Phase 1 file"
      - id: ASI07
        tools: [safelabs]
        status: unverified
        confidence: low
      - id: ASI08
        tools: [safelabs]
        status: unverified
        confidence: low
        coverage: partial
      - id: ASI09
        tools: [safelabs]
        status: unverified
        confidence: low
      - id: ASI10
        tools: []
        status: not_covered
        note: "Rogue Agents — no mapped tool coverage in Phase 1"
    not_claiming:
      - "SafeLabs ASI IDs equal official OWASP Agentic ASI IDs"
      - "Full Agentic Top 10 coverage"
      - "Confirmed findings from pattern-only SafeLabs detectors (cap at potential)"

honesty:
  - "CWE lists are reused from iso_42001_2023.yaml llm_top10 only; empty for LLM09."
  - "Garak owasp:llm tag numbers are 2023-era; behaviour mapping is required."
  - "SafeLabs ASI labels differ from OWASP Agentic ASI labels — always remap."
  - "partial / not_covered / unverified mean unsupported categories are not treated as covered."
  - "assessment_tools on the ISO pack name evidence sources; they do not invent new CWEs or claim met."

