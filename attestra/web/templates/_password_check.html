<script>
  (function () {
    const pw = document.getElementById('password'), cf = document.getElementById('confirm');
    const st = document.getElementById('pw_strength'), mt = document.getElementById('pw_match');
    const form = document.getElementById('pwform');
    function check() {
      const v = pw.value;
      const kinds = [/[a-z]/, /[A-Z]/, /[0-9]/, /[^A-Za-z0-9]/].filter(r => r.test(v)).length;
      if (v.length < 12) st.textContent = 'At least 12 characters (' + v.length + ' so far).';
      else st.textContent = kinds >= 3 ? 'Strong password.' : 'OK. Mixing upper and lower case, digits and symbols makes it stronger.';
      mt.textContent = cf.value ? (cf.value === v ? 'Passwords match.' : 'Passwords do not match.') : '';
    }
    pw.addEventListener('input', check); cf.addEventListener('input', check);
    form.addEventListener('submit', ev => { if (pw.value !== cf.value) { ev.preventDefault(); check(); cf.focus(); } });
  })();
</script>
